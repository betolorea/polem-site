<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>§404 · Cláusula no encontrada — Polem</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:600;font-display:swap;src:url('./assets/fonts/bodoni-moda-600.woff2') format('woff2');}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:400;font-display:swap;src:url('./assets/fonts/newsreader-400.woff2') format('woff2');}
@font-face{font-family:'Martian Mono';font-style:normal;font-weight:400;font-display:swap;src:url('./assets/fonts/martian-mono-400.woff2') format('woff2');}
@font-face{font-family:'Martian Mono';font-style:normal;font-weight:500;font-display:swap;src:url('./assets/fonts/martian-mono-500.woff2') format('woff2');}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  background:#0b1420;color:#f5f3ee;font-family:"Newsreader",Georgia,serif;
  padding:48px 24px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin-inline:auto;width:100%}
.rule{height:4px;background:#f5f3ee;border:0;margin:0 0 40px}
.grid{display:grid;gap:24px}
@media(min-width:860px){.grid{grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}}
.cn{font-family:"Martian Mono",monospace;font-size:14px;font-weight:500;letter-spacing:.02em;
  color:#c9a961;background:#0b1420;display:block}
.ct{font-family:"Martian Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;color:#8fa3b8;background:#0b1420;display:block;margin-top:8px}
h1{font-family:"Bodoni Moda",serif;font-size:40px;font-weight:600;line-height:.95;
  letter-spacing:-.03em;margin:0;color:#f5f3ee;background:#0b1420}
@media(min-width:860px){h1{font-size:72px}}
p{font-size:19px;line-height:1.6;margin:24px 0 0;max-width:56ch;color:#c9d3de;background:#0b1420}
.btn{display:inline-flex;align-items:center;min-height:60px;padding:18px 28px;margin-top:40px;
  font-family:"Martian Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;text-decoration:none;border:2px solid #f5f3ee;
  background:#f5f3ee;color:#0b1420;transition:none}
.btn:hover,.btn:focus-visible{background:#0b1420;color:#f5f3ee}
:focus-visible{outline:2px solid #c9a961;outline-offset:3px}
</style></head>
<body><div class="wrap"><hr class="rule">
<div class="grid">
  <div><span class="cn">§404</span><span class="ct">Cláusula no encontrada</span></div>
  <div>
    <h1>Esta página no está en el índice.</h1>
    <p>La dirección que buscas no corresponde a ninguna cláusula de este documento. Puede que el enlace haya cambiado de revisión o que nunca haya existido.</p>
    <a class="btn" href="/">Volver a la portada</a>
  </div>
</div></div></body></html>
